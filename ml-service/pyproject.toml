[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agri-ml"
version = "0.1.0"
description = "ML/Data Science service for the Agricultural Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
# Runtime needed to serve the API. Kept separate from the ML stack so the
# service skeleton stays lightweight.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# Data science / training stack. Deep learning (PyTorch) and geospatial
# (Earth Engine, GeoPandas, rasterio) are intentionally absent until a phase needs them.
ml = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "mlflow>=2.16",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agri_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
