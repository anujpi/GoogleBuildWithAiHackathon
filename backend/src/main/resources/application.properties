spring.application.name=backend

# Defaults match compose.yaml (local dev only); override via env vars elsewhere.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/agri}
spring.datasource.username=${DB_USERNAME:agri}
spring.datasource.password=${DB_PASSWORD:agri}

spring.jpa.open-in-view=false
# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it.
spring.jpa.hibernate.ddl-auto=validate

# Comma-separated; local frontend by default.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management.endpoints.web.exposure.include=health
