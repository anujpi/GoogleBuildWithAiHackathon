spring.application.name=backend

# Optional git-ignored local overrides (e.g. JWT_SECRET for development). Real environment variables win over it.
# Both paths so it works whether the working directory is the repo root or backend/.
spring.config.import=optional:file:./application-local.properties,optional:file:./backend/application-local.properties

# Defaults match compose.yaml (local dev only); override via env vars elsewhere.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/agri}
spring.datasource.username=${DB_USERNAME:agri}
spring.datasource.password=${DB_PASSWORD:agri}

spring.jpa.open-in-view=false
# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it.
spring.jpa.hibernate.ddl-auto=validate

# Comma-separated; local frontend by default.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management.endpoints.web.exposure.include=health
# ML and weather report DEGRADED (never DOWN) when unavailable; only the database can take the app DOWN.
management.endpoint.health.status.order=DOWN,DEGRADED,UP
management.endpoint.health.show-components=always

# Required, no default: startup fails unless JWT_SECRET is set (>= 32 bytes). Never commit a real value.
# Generate one with e.g.: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET:}
# ISO-8601 or Spring duration format (e.g. PT1H, 30m).
app.jwt.expiration=${JWT_EXPIRATION:PT1H}

# Python ML service (FastAPI). Only Spring Boot calls it; the frontend never does.
app.ml.base-url=${ML_SERVICE_BASE_URL:http://localhost:8000}
app.ml.connect-timeout=${ML_SERVICE_CONNECT_TIMEOUT:2s}
app.ml.read-timeout=${ML_SERVICE_READ_TIMEOUT:10s}

# Weather: Open-Meteo Forecast API, no API key. Successful answers are cached in-process; failures never are.
app.weather.base-url=${WEATHER_BASE_URL:https://api.open-meteo.com}
app.weather.connect-timeout=${WEATHER_CONNECT_TIMEOUT:2s}
app.weather.read-timeout=${WEATHER_READ_TIMEOUT:5s}
app.weather.cache-ttl=${WEATHER_CACHE_TTL:PT30M}

# Mirror the ML service's supported scope into ref_* at startup. A failure is logged; the app still starts.
app.reference.sync-on-startup=${REFERENCE_SYNC_ON_STARTUP:true}

# If set and no ADMIN exists, this already-registered user becomes ADMIN at startup. Never a password.
app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
