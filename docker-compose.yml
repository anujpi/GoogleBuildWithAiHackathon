# Full local/VM stack: PostGIS + ML service + backend + frontend.
#   export JWT_SECRET=$(openssl rand -base64 48); export GEMINI_API_KEY=...   # optional
#   docker compose up --build        -> http://localhost:5173
# Model artifacts must exist in ml-service/artifacts/ before building (they are git-ignored).
services:
  db:
    image: postgis/postgis:17-3.5
    environment: { POSTGRES_DB: agri, POSTGRES_USER: agri, POSTGRES_PASSWORD: agri }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U agri"], interval: 5s, retries: 20 }
  ml:
    build: { context: ., dockerfile: ml-service/Dockerfile }
    environment: { PORT: "8000" }
  backend:
    build: ./backend
    depends_on: { db: { condition: service_healthy }, ml: { condition: service_started } }
    environment:
      DB_URL: jdbc:postgresql://db:5432/agri
      DB_USERNAME: agri
      DB_PASSWORD: agri
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ML_SERVICE_URL: http://ml:8000
      ML_READ_TIMEOUT: PT30S
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports: ["8080:8080"]
  frontend:
    build: { context: ./frontend, args: { VITE_API_BASE_URL: "http://localhost:8080/api" } }
    ports: ["5173:8080"]
volumes:
  pgdata:
