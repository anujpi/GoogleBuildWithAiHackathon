spring.application.name=backend

# Defaults match compose.yaml (local dev only); override via env vars elsewhere.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agri}
spring.datasource.username=${DB_USERNAME:agri}
spring.datasource.password=${DB_PASSWORD:agri}

spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
