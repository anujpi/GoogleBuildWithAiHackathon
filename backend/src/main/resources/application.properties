spring.application.name=backend

# Defaults match compose.yaml (local dev only); override via env vars elsewhere.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/agri}
spring.datasource.username=${DB_USERNAME:agri}
spring.datasource.password=${DB_PASSWORD:agri}

spring.jpa.open-in-view=false
# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it.
spring.jpa.hibernate.ddl-auto=validate

# Comma-separated; local frontend by default.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management.endpoints.web.exposure.include=health

# Required, no default: startup fails unless JWT_SECRET is set (>= 32 bytes). Never commit a real value.
# Generate one with e.g.: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET:}
# ISO-8601 or Spring duration format (e.g. PT1H, 30m).
app.jwt.expiration=${JWT_EXPIRATION:PT1H}

# Python ML service (ml-service/). Local default; override with ML_SERVICE_URL elsewhere.
app.ml.base-url=${ML_SERVICE_URL:http://localhost:8000}
app.ml.connect-timeout=${ML_CONNECT_TIMEOUT:PT2S}
app.ml.read-timeout=${ML_READ_TIMEOUT:PT10S}

# Leaf photos for /api/disease/diagnose (the ML service accepts up to 10 MB).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Live weather (Open-Meteo, no key).
app.weather.base-url=${WEATHER_BASE_URL:https://api.open-meteo.com}

# Google Gemini for the AI advisory. Without a key the advisory falls back to a labelled template summary.
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
app.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
